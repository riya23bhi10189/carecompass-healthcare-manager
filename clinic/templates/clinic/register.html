{% extends "clinic/base.html" %}

{% block content %}
  <div class="card">
    <h1>Create patient account</h1>
    <p>Book appointments and manage your care journey.</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Create account</button>
    </form>

    <p>Already registered? <a href="{% url 'login' %}">Log in</a></p>
  </div>
{% endblock %}
