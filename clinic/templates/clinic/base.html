<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareCompass</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8f5;
      color: #18352a;
    }

    nav {
      display: flex;
      justify-content: space-between;
      padding: 18px 8%;
      background: #ffffff;
      border-bottom: 1px solid #dce8e0;
    }

    nav a {
      margin-left: 16px;
      color: #16724c;
      font-weight: bold;
      text-decoration: none;
    }

    .container {
      width: min(900px, calc(100% - 32px));
      margin: 42px auto;
    }

    .card {
      margin: 18px 0;
      padding: 24px;
      background: white;
      border: 1px solid #dce8e0;
      border-radius: 14px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin: 5px 0 14px;
      box-sizing: border-box;
    }

    button {
      padding: 11px 18px;
      border: 0;
      border-radius: 7px;
      background: #16724c;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: #e4f5eb;
      color: #16724c;
      font-weight: bold;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <nav>
    <a href="{% url 'dashboard' %}">CareCompass</a>

    <div>
      {% if user.is_authenticated %}
        <span>Hello, {{ user.first_name|default:user.username }}</span>
        <a href="{% url 'logout' %}">Log out</a>
      {% else %}
        <a href="{% url 'login' %}">Log in</a>
        <a href="{% url 'register' %}">Create account</a>
      {% endif %}
    </div>
  </nav>

  <main class="container">
    {% if messages %}
      {% for message in messages %}
        <div class="card">{{ message }}</div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
